<!doctype html>
<html><head><meta charset="utf-8"><title>Event Podium</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    font-family: -apple-system, 'Segoe UI', Roboto, Inter, system-ui, sans-serif; color: #eef4ff;
    background: radial-gradient(circle at 20% -10%, #1b2c4b 0%, #070b14 58%);
    position: relative;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .32; }
  .b1 { width: 560px; height: 560px; background: #b8ff5a; top: -220px; left: -180px; }
  .b2 { width: 520px; height: 520px; background: #5ad1ff; bottom: -200px; right: -160px; }
  .b3 { width: 380px; height: 380px; background: #a05aff; top: 520px; right: 120px; opacity: .2; }
  .wrap { position: relative; height: 100%; padding: 70px 70px 56px; display: flex; flex-direction: column; }

  .pill {
    align-self: center; display: inline-flex; gap: 10px; align-items: center;
    background: #17253f; border: 2px solid #223049; border-radius: 999px;
    padding: 10px 24px; font-size: 22px; font-weight: 800; letter-spacing: .12em; color: #b8ff5a;
  }
  .pill i { width: 12px; height: 12px; border-radius: 50%; background: #b8ff5a; display: block; }
  h1 { text-align: center; font-size: 82px; line-height: 1.02; letter-spacing: -.03em; margin-top: 34px;
       text-shadow: 0 0 40px rgba(184,255,90,.25); }
  h1 span { color: #b8ff5a; }
  .sub { text-align: center; font-size: 30px; color: #8ea0bd; margin-top: 18px; }

  .curve { margin: 26px auto 0; display: block; }

  .podium { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 26px; margin-top: 10px; }
  .spot { width: 292px; display: flex; flex-direction: column; align-items: center; }
  .medal { font-size: 92px; line-height: 1; filter: drop-shadow(0 8px 18px rgba(0,0,0,.45)); }
  .name { font-size: 46px; font-weight: 800; margin-top: 12px; letter-spacing: -.01em; text-align: center; }
  .praise { font-size: 24px; white-space: nowrap; color: #c9d6ee; text-align: center; margin-top: 8px; line-height: 1.3; min-height: 60px; }
  .block {
    width: 100%; margin-top: 20px; border-radius: 26px 26px 0 0; border: 2px solid; border-bottom: none;
    display: flex; flex-direction: column; align-items: center; padding-top: 26px;
  }
  .block .n { font-size: 96px; font-weight: 900; line-height: 1; letter-spacing: -.03em; }
  .block .l { font-size: 22px; text-transform: uppercase; letter-spacing: .14em; color: #8ea0bd; margin-top: 6px; font-weight: 700; }
  .block .pos { margin-top: auto; margin-bottom: 22px; font-size: 30px; font-weight: 900; opacity: .75; }
  .first .block { height: 400px; border-color: #ffd666; background: linear-gradient(#ffd66633, #ffd66608); }
  .first .n { color: #ffd666; }
  .first .name { font-size: 54px; }
  .second .block { height: 320px; border-color: #cfd8e8; background: linear-gradient(#cfd8e82b, #cfd8e806); }
  .second .n { color: #e3eaf6; }
  .third .block { height: 260px; border-color: #e3a36b; background: linear-gradient(#e3a36b2b, #e3a36b06); }
  .third .n { color: #f0b884; }

  .foot {
    border-top: 2px solid #223049; padding-top: 26px; display: flex; justify-content: space-between; align-items: center;
    font-size: 26px; color: #8ea0bd;
  }
  .foot b { color: #eef4ff; }
  .foot .brand { font-weight: 800; color: #eef4ff; }
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="wrap">
    <div class="pill"><i></i>{{PILL}}</div>
    <h1>{{TITLE}}</h1>
    <p class="sub">{{SUB}}</p>

    <svg class="curve" width="760" height="120" viewBox="0 0 760 120" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" x2="1">
          <stop offset="0" stop-color="#a05aff"/><stop offset=".5" stop-color="#5ad1ff"/><stop offset="1" stop-color="#b8ff5a"/>
        </linearGradient>
      </defs>
      <path id="valley" d="M10 20 C 120 20, 150 95, 250 90 S 360 45, 420 60 S 560 112, 660 108 S 740 60, 750 40"
            fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>
      <path id="trail" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 8" opacity=".6"/>
      <g id="balls" fill="#fff" stroke="#070b14" stroke-width="3"></g>
      <g id="flag"></g>
    </svg>

    <div class="podium">{{PODIUM}}
    </div>

    <div class="foot">
      <span>{{FOOT}}</span>
      <span class="brand">{{THANKS}}</span>
    </div>
  </div>
<script>
  const v = document.getElementById('valley'), L = v.getTotalLength();
  const ts = [0.04, 0.2, 0.4, 0.62, 0.8];
  const pts = ts.map(t => v.getPointAtLength(t * L));
  document.getElementById('trail').setAttribute('d', 'M' + pts.map(q => q.x + ' ' + q.y).join(' L'));
  const g = document.getElementById('balls');
  pts.forEach((q, i) => {
    const last = i === pts.length - 1;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', q.x); c.setAttribute('cy', q.y); c.setAttribute('r', last ? 11 : 8);
    c.setAttribute('opacity', last ? 1 : 0.4 + i * 0.13);
    g.appendChild(c);
  });
  const e = pts[pts.length - 1];
  document.getElementById('flag').innerHTML =
    `<path d="M${e.x} ${e.y - 12} V ${e.y - 58}" stroke="#fff" stroke-width="3"/>` +
    `<path d="M${e.x} ${e.y - 58} L ${e.x + 28} ${e.y - 48} L ${e.x} ${e.y - 38} Z" fill="#ff4d6d"/>`;

  // long names/captions shrink to fit their podium column instead of overflowing it
  document.querySelectorAll('.name, .praise').forEach((el) => {
    let size = parseFloat(getComputedStyle(el).fontSize);
    el.style.whiteSpace = 'nowrap';
    while (el.scrollWidth > el.parentElement.clientWidth && size > 14) el.style.fontSize = (size -= 1) + 'px';
  });
</script>
</body></html>
